name: PM Cycle

# AgriFlow 자율 PM 에이전트 — 5시간마다 dev 브랜치 분석 후 작업 후보를 GitHub Issue로 게시 + 모바일 푸시.
# 사용자 노트북 상태와 무관하게 GitHub-hosted runner에서 실행됨.

on:
  schedule:
    # UTC 기준 5시간마다 (KST = UTC+9)
    # 00:00, 05:00, 10:00, 15:00, 20:00 UTC
    # = 09:00, 14:00, 19:00, 00:00, 05:00 KST
    - cron: '0 0,5,10,15,20 * * *'
  workflow_dispatch:  # 수동 트리거 — 첫 테스트 및 임시 호출용

permissions:
  contents: read
  issues: write       # 이슈 생성 + 라벨 생성

jobs:
  pm-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 100  # git log 24h를 위해

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install anthropic

      - name: Run PM agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/pm-agent.py
